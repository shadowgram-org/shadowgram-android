name: Build APK

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && 'draft-release' || github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/master' }}

env:
  APK_OUTPUT: TMessagesProj_App/build/outputs/apk/afat/release/app.apk

jobs:
  release-apk:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: android-release
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_EXECUTABLE: ccache

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            build-tools;30.0.3
            ndk;21.4.7075529
            cmake;3.10.2.4988404

      - name: Apply dx compatibility workaround
        # build-tools 35 removed dx, but some dependencies still need it
        run: |
          cp "$ANDROID_HOME/build-tools/30.0.3/dx" "$ANDROID_HOME/build-tools/35.0.0/dx"
          cp "$ANDROID_HOME/build-tools/30.0.3/lib/dx.jar" "$ANDROID_HOME/build-tools/35.0.0/lib/dx.jar"

      - name: Install ccache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ccache
          fi
          ccache --version

      - name: Compute ccache key
        id: ccache-key
        run: |
          native_config_hash="${{ hashFiles('build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'TMessagesProj/build.gradle', 'TMessagesProj_App/build.gradle', 'TMessagesProj/jni/**/CMakeLists.txt', 'TMessagesProj/jni/**/*.cmake') }}"
          cache_prefix="ccache-v1-${RUNNER_OS}-ndk21.4.7075529-${native_config_hash}"
          echo "prefix=${cache_prefix}" >> "$GITHUB_OUTPUT"
          echo "key=${cache_prefix}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-key.outputs.key }}
          restore-keys: |
            ${{ steps.ccache-key.outputs.prefix }}-
            ccache-v1-${{ runner.os }}-ndk21.4.7075529-
            ccache-v1-${{ runner.os }}-

      - name: Configure ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size=4G
          ccache --set-config=base_dir="$GITHUB_WORKSPACE"
          ccache --set-config=compiler_check=content
          ccache --set-config=compression=true
          ccache -z

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        run: |
          install -d "$RUNNER_TEMP/keystore"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/keystore/release.keystore"
          chmod 600 "$RUNNER_TEMP/keystore/release.keystore"
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}

      - name: Build signed release APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/21.4.7075529"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          ./gradlew :TMessagesProj_App:assembleAfatRelease
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
          ANDROID_RELEASE_STORE_FILE: ${{ runner.temp }}/keystore/release.keystore
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ vars.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Save ccache
        if: always() && steps.restore-ccache.outputs.cache-primary-key != '' && steps.restore-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore-ccache.outputs.cache-primary-key }}

      - name: Prepare APK artifact
        id: apk
        run: |
          set -euo pipefail

          install -d dist
          version_name="$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2-)"
          version_code="$(grep '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2-)"
          short_sha="${GITHUB_SHA::7}"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_tag="$GITHUB_REF_NAME"
            release_version="${GITHUB_REF_NAME#v}"
          else
            release_version="$version_name"
            release_tag="v${release_version}"
          fi

          safe_release_tag="${release_tag//\//-}"
          apk_name="shadowgram-${safe_release_tag}.apk"
          artifact_name="shadowgram-${safe_release_tag}-${short_sha}-apk"

          if [[ "$GITHUB_REF" == refs/tags/v* && "$release_version" != "$version_name" ]]; then
            echo "::warning::Tag version '$release_version' does not match APP_VERSION_NAME '$version_name'."
          fi

          cp "$APK_OUTPUT" "dist/$apk_name"

          {
            echo "apk_name=$apk_name"
            echo "apk_path=dist/$apk_name"
            echo "artifact_name=$artifact_name"
            echo "release_tag=$release_tag"
            echo "release_version=$release_version"
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "short_sha=$short_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Update draft release notes
        if: ${{ github.ref == 'refs/heads/master' }}
        id: draft_release
        uses: release-drafter/release-drafter@v7
        with:
          tag: ${{ steps.apk.outputs.release_tag }}
          version: ${{ steps.apk.outputs.release_version }}
          commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload APK to draft release
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.apk.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: ${{ steps.apk.outputs.apk_path }}
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Refresh tagged release notes
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
        id: tagged_release_draft
        uses: release-drafter/release-drafter@v7
        with:
          tag: ${{ steps.apk.outputs.release_tag }}
          version: ${{ steps.apk.outputs.release_version }}
          commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload APK and publish tagged release
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.apk.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.apk.outputs.apk_path }}
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
